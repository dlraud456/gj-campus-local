        .replace(/</g, '&lt;')

    /**
     * Store abstraction layer.
     * In production, replace `safeStorageGet`/`safeStorageSet` calls inside each method
     * with `supabase.from('...').select()` / `.insert()` / `.update()`.
     */
    const store = {
      getPosts() {
        const saved = safeStorageGet(STORAGE_KEYS.POSTS);
        if (!saved) {
          safeStorageSet(STORAGE_KEYS.POSTS, SEED_POSTS);
          return JSON.parse(JSON.stringify(SEED_POSTS));
        }
        return saved;
      },
      createPost(post) {
        const posts = this.getPosts();
        const newPost = {
          id: 'post-' + Date.now(),
          category: post.category,
          univ: post.univ,
          author: post.author || 'Guest',
          lang: post.lang || appState.lang,
          title: post.title,
          body: post.body,
          translations: {},
          createdAt: '방금 전',
          reports: 0,
          hidden: false,
          comments: []
        };
        posts.unshift(newPost);
        safeStorageSet(STORAGE_KEYS.POSTS, posts);
        return newPost;
      },
      addComment(postId, comment) {
        const posts = this.getPosts();
        const target = posts.find(p => p.id === postId);
        if (!target) return null;
        target.comments.push({
          id: 'c-' + Date.now(),
          author: comment.author || 'Guest',
          lang: comment.lang || appState.lang,
          text: comment.text,
          translations: {}
        });
        safeStorageSet(STORAGE_KEYS.POSTS, posts);
        return target;
      },
      reportPost(postId) {
        const posts = this.getPosts();
        const target = posts.find(p => p.id === postId);
        if (target) {
          target.reports = (target.reports || 0) + 1;
          safeStorageSet(STORAGE_KEYS.POSTS, posts);
        }
        return target;
      },
      setPostHidden(postId, hidden) {
        const posts = this.getPosts();
        const target = posts.find(p => p.id === postId);
        if (target) {
          target.hidden = hidden;
          safeStorageSet(STORAGE_KEYS.POSTS, posts);
        }
        return target;
      },
      getFestivals() {
        const saved = safeStorageGet(STORAGE_KEYS.FESTIVALS);
        if (!saved) {
          safeStorageSet(STORAGE_KEYS.FESTIVALS, SEED_FESTIVALS);
          return JSON.parse(JSON.stringify(SEED_FESTIVALS));
        }
        return saved;
      },
      createFestival(fest) {
        const fests = this.getFestivals();
        const newFest = {
          id: 'fest-' + Date.now(),
          title: fest.title,
          titleEn: fest.titleEn || fest.title,
          univTag: fest.univTag || '전체',
          region: fest.region,
          date: fest.date,
          location: fest.location,
          transit: fest.transit,
          fee: fest.fee || '무료',
          badge: fest.badge || '🎉 신규 행사',
          color: 'from-violet-600 to-indigo-600'
        };
        fests.unshift(newFest);
        safeStorageSet(STORAGE_KEYS.FESTIVALS, fests);
        return newFest;
      },
      getChecks() {
        return safeStorageGet(STORAGE_KEYS.CHECKS) || {};
      },
      toggleCheck(checkId) {
        const checks = this.getChecks();
        checks[checkId] = !checks[checkId];
        safeStorageSet(STORAGE_KEYS.CHECKS, checks);
        return checks;
      }
    };

    /**
     * In production, replace the fallback lookup below with:
     * const res = await fetch('/api/translate', {
     *   method: 'POST',
     *   headers: { 'Content-Type': 'application/json' },
     *   body: JSON.stringify({ text, targetLang })
     * });
     * const data = await res.json();
     * return data.translatedText;
     */
    async function translateText(item, targetLang, isComment = false) {
      if (isComment) {
        if (item.translations && item.translations[targetLang]) {
          return item.translations[targetLang];
        }
        return `[${targetLang.toUpperCase()} 번역 미리보기] ${item.text}`;
      }
      if (item.translations && item.translations[targetLang]) {
        return item.translations[targetLang];
      }
      return {
        title: `[${targetLang.toUpperCase()} 번역 미리보기] ${item.title}`,
        body: `[${targetLang.toUpperCase()} 번역 미리보기] ${item.body}`
      };
    }

       5. DOMAIN CONTENT DATA (Settlement Roadmap, Campus Tips, Show Cards)
       ========================================================================= */
    function loc(obj, field) {
      if (!obj) return '';
      const lang = appState.lang || 'ko';
      if (lang === 'ko') return obj[field];
      if (obj.i18n && obj.i18n[lang] && obj.i18n[lang][field] !== undefined) {
        return obj.i18n[lang][field];
      }
      if (obj.i18n && obj.i18n.en && obj.i18n.en[field] !== undefined) {
        return obj.i18n.en[field];
      }
      return obj[field];
    }

    /* =========================================================================

       ========================================================================= */
    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.remove('hidden');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        el.classList.add('hidden');
      }, 2600);
    }

    function speakKorean(text) {
      if (!('speechSynthesis' in window)) {
        showToast('이 브라우저에서는 음성 읽기를 지원하지 않습니다.');
        return;
      }
      try {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'ko-KR';
        utter.rate = 0.9;
        window.speechSynthesis.speak(utter);
        showToast('🔊 한국어로 읽어주고 있어요');
      } catch (e) {
        showToast('음성 재생을 시작할 수 없습니다.');
      }
    }

    function renderHeaderAndNav() {
      const subtitleEl = document.getElementById('header-subtitle');
      if (subtitleEl) subtitleEl.textContent = t('subtitle');

      const langSelect = document.getElementById('lang-select');
      if (langSelect && langSelect.value !== appState.lang) {
        langSelect.value = appState.lang;
      }

      const bottomNav = document.getElementById('bottom-nav');
      if (isAdminRoute()) {
        bottomNav.classList.add('hidden');
      } else {
        bottomNav.classList.remove('hidden');
        document.querySelectorAll('.nav-btn').forEach(btn => {
          const tab = btn.dataset.tab;
          const label = btn.querySelector('[data-i18n]');
          if (label) label.textContent = t(label.dataset.i18n);
          if (tab === appState.activeTab) {
            btn.classList.remove('text-slate-400', 'hover:text-slate-600');
            btn.classList.add('text-indigo-600', 'bg-indigo-50/70');

            btn.classList.remove('text-indigo-600', 'bg-indigo-50/70');
            btn.classList.add('text-slate-400', 'hover:text-slate-600');
          }
        });
      }
    }

      let html = `

              </div>
              <span class="bg-white/20 backdrop-blur px-2.5 py-1 rounded-full text-xs font-bold shrink-0">${pct}%</span>

            </div>

          <div class="space-y-3">

        html += `
          <div class="bg-white rounded-2xl border ${isOpen ? 'border-indigo-300 ring-2 ring-indigo-50' : 'border-slate-200'} shadow-sm overflow-hidden transition-all">
            <button type="button" data-action="toggle-step" data-step="${step.id}" class="w-full text-left p-4 flex items-center gap-3">
              <div class="w-10 h-10 rounded-xl ${isOpen ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-700'} flex items-center justify-center text-lg shrink-0 font-bold transition-colors">

              <div class="flex-1 min-w-0">

                <h3 class="text-sm font-bold text-slate-900 mt-1 truncate">${step.num}. ${escapeHtml(loc(step, 'title'))}</h3>
                <p class="text-xs text-slate-500 truncate">${escapeHtml(loc(step, 'subtitle'))}</p>
              </div>
              <svg class="w-5 h-5 text-slate-400 shrink-0 transition-transform ${isOpen ? 'rotate-180 text-indigo-600' : ''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
        `;

        if (isOpen) {
          html += `

              <p class="text-xs text-slate-600 leading-relaxed bg-slate-50 p-3 rounded-xl">${escapeHtml(loc(step, 'summary'))}</p>
          `;

          if (step.jurisdictionBox) {
            html += `
              <div class="rounded-xl border border-rose-200 bg-rose-50/70 p-3 space-y-2">
                <div class="flex items-center gap-1.5 text-xs font-extrabold text-rose-800">
                  <span>⚠️</span>
                  <span>광주 vs 여수·광양 vs 목포 관할 구분 필수!</span>
                </div>
                <div class="space-y-1.5">
                  ${step.jurisdictionBox.map(j => `
                    <div class="bg-white rounded-lg p-2 border border-rose-100 text-[11px]">
                      <div class="font-bold text-slate-800">${escapeHtml(loc(j, 'office'))}</div>
                      <div class="text-indigo-700 font-semibold">${escapeHtml(loc(j, 'area'))}</div>
                      <div class="text-slate-500 mt-0.5">${escapeHtml(j.addr)}</div>
                    </div>
                  `).join('')}
                </div>
              </div>
            `;
          }

          // Checklist
          html += `
            <div>
              <h4 class="text-xs font-extrabold text-slate-800 mb-2 flex items-center gap-1.5">
                <span>✅</span> ${escapeHtml(t('checklist_title'))}
              </h4>
              <div class="space-y-2">
                ${step.checklist.map(c => {
                  const checked = !!checks[c.id];
                  return `
                    <label class="flex items-start gap-2.5 p-2.5 rounded-xl border ${checked ? 'bg-emerald-50/60 border-emerald-200' : 'bg-white border-slate-200'} cursor-pointer">
                      <input type="checkbox" data-action="toggle-check" data-check="${c.id}" ${checked ? 'checked' : ''} class="mt-0.5 w-4 h-4 rounded text-indigo-600 focus:ring-indigo-500 shrink-0" />

              </h4>
              ${step.quizzes.map((qz, qIdx) => {
                const key = `${step.id}-${qIdx}`;
                const picked = appState.quizAnswers[key];
                const answered = picked !== undefined;
                const isCorrect = picked === qz.correct;
                const qText = loc(qz, 'q');
                const qOpts = loc(qz, 'options');
                const qExp = loc(qz, 'explain');
                return `
                  <div class="bg-white rounded-xl p-3 border border-indigo-100 space-y-2">
                    <p class="text-xs font-bold text-slate-800 leading-snug">Q${qIdx + 1}. ${escapeHtml(qText)}</p>
                    <div class="space-y-1.5">
                      ${qOpts.map((opt, oIdx) => {
                        let btnStyle = 'border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100';
                        if (answered) {
                          if (oIdx === qz.correct) btnStyle = 'border-emerald-400 bg-emerald-50 text-emerald-900 font-bold';
                          else if (oIdx === picked) btnStyle = 'border-rose-400 bg-rose-50 text-rose-900';
                        }
                        return `
                          <button type="button" data-action="answer-quiz" data-qkey="${key}" data-oidx="${oIdx}" class="w-full text-left text-xs px-3 py-2 rounded-lg border transition-colors ${btnStyle}">

                    ${answered ? `
                      <div class="text-[11px] p-2 rounded-lg ${isCorrect ? 'bg-emerald-50 text-emerald-800' : 'bg-amber-50 text-amber-900'}">
                        <div class="font-bold mb-0.5">${isCorrect ? escapeHtml(t('quiz_correct')) : escapeHtml(t('quiz_wrong'))}</div>
                        <div>${escapeHtml(qExp)}</div>
                      </div>
                    ` : ''}
                  </div>
                `;
              }).join('')}
            </div>
          `;

          html += `</div>`;
        }
        html += `</div>`;
      });

      html += `</div></section>`;
      return html;
    }

    function renderApp() {
      renderHeaderAndNav();
      const main = document.getElementById('main-content');
      if (isAdminRoute()) {
        main.innerHTML = renderAdminRoute();
        return;
      }
      if (appState.activeTab === 'guide') main.innerHTML = renderGuideTab();
      else if (appState.activeTab === 'campus') main.innerHTML = renderCampusTab();
      else if (appState.activeTab === 'cards') main.innerHTML = renderCardsTab();
      else if (appState.activeTab === 'community') main.innerHTML = renderCommunityTab();
    }

    /* =========================================================================
       10. MODALS (Write Post & Comments)
       ========================================================================= */
    function openModal(html) {
      const root = document.getElementById('modal-root');
      const panel = document.getElementById('modal-panel');
      panel.innerHTML = html;
      root.classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal-root').classList.add('hidden');
      document.getElementById('modal-panel').innerHTML = '';
    }

    function openWritePostModal(prefill = {}) {
      const catVal = prefill.category || '질문(Q&A)';
      const univVal = prefill.univ || '전남대(광주/여수)';
      const titleVal = prefill.title || '';

      openModal(`
        <div class="p-5 space-y-4 overflow-y-auto">
          <div class="flex items-center justify-between">
            <h3 class="text-base font-extrabold text-slate-900">✏️ ${escapeHtml(t('write_post'))}</h3>
            <button type="button" data-action="close-modal" class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 font-bold">✕</button>
          </div>
          <form id="write-post-form" class="space-y-3 text-xs">
            <div class="grid grid-cols-2 gap-2">
              <select name="category" class="px-3 py-2.5 rounded-xl border border-slate-200 font-semibold">
                ${COMM_CATEGORIES.filter(c => c.id !== '전체').map(c => `<option value="${escapeHtml(c.id)}" ${catVal === c.id ? 'selected' : ''}>${escapeHtml(t(c.i18nKey))}</option>`).join('')}
              </select>
              <select name="univ" class="px-3 py-2.5 rounded-xl border border-slate-200 font-semibold">
                ${UNIVERSITIES.filter(u => u !== '전체').map(u => `<option value="${escapeHtml(u)}" ${univVal === u ? 'selected' : ''}>${escapeHtml(u)}</option>`).join('')}
              </select>
            </div>
            <input name="author" type="text" placeholder="닉네임 (예: Alex / VN)" class="w-full px-3 py-2.5 rounded-xl border border-slate-200" required />
            <input name="title" type="text" value="${escapeHtml(titleVal)}" placeholder="제목 (모국어로 작성해도 OK!)" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 font-semibold" required />
            <textarea name="body" rows="4" placeholder="내용을 자유롭게 작성하세요..." class="w-full px-3 py-2.5 rounded-xl border border-slate-200" required></textarea>
            <div class="flex gap-2 pt-1">
              <button type="button" data-action="close-modal" class="flex-1 py-3 rounded-xl bg-slate-100 text-slate-700 font-bold">${escapeHtml(t('cancel'))}</button>
              <button type="submit" class="flex-1 py-3 rounded-xl bg-indigo-600 text-white font-bold">${escapeHtml(t('submit'))}</button>
            </div>
          </form>
        </div>
      `);
    }

    function openCommentsModal(postId) {
      const post = store.getPosts().find(p => p.id === postId);
      if (!post) return;
      const comments = post.comments || [];

      openModal(`
        <div class="p-5 flex flex-col max-h-[82vh]">
          <div class="flex items-center justify-between pb-3 border-b border-slate-100">
            <h3 class="text-sm font-extrabold text-slate-900 truncate pr-2">💬 ${escapeHtml(post.title)}</h3>
            <button type="button" data-action="close-modal" class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 font-bold shrink-0">✕</button>
          </div>
          <div class="flex-1 overflow-y-auto py-3 space-y-2.5">
            ${comments.length === 0 ? `<p class="text-xs text-slate-400 text-center py-6">첫 번째 댓글을 남겨보세요.</p>` : comments.map(c => {
              const isTrans = !!appState.translatedComments[c.id];
              const cCacheKey = `comment:${c.id}:${appState.lang}`;
              const transText = appState.translationCache[cCacheKey] || (c.translations && c.translations[appState.lang]) || c.text;
              return `
                <div class="bg-slate-50 rounded-xl p-3 space-y-1.5">
                  <div class="flex items-center justify-between text-[11px]">
                    <span class="font-bold text-slate-800">${escapeHtml(c.author)}</span>
                    <button type="button" data-action="toggle-translate-comment" data-post-id="${post.id}" data-comment-id="${c.id}" class="font-bold text-indigo-600 hover:underline">
                      🌐 ${isTrans ? escapeHtml(t('translate_orig')) : escapeHtml(t('translate_show'))}
                    </button>
                  </div>
                  <p class="text-xs text-slate-700 leading-relaxed">${escapeHtml(isTrans ? transText : c.text)}</p>
                </div>
              `;
            }).join('')}
          </div>
          <form id="add-comment-form" data-post-id="${post.id}" class="pt-3 border-t border-slate-100 space-y-2 text-xs">
            <input name="author" type="text" placeholder="닉네임" class="w-full px-3 py-2 rounded-xl border border-slate-200" required />
            <div class="flex gap-2">
              <input name="text" type="text" placeholder="${escapeHtml(t('add_comment'))}" class="flex-1 px-3 py-2 rounded-xl border border-slate-200" required />
              <button type="submit" class="px-4 py-2 rounded-xl bg-indigo-600 text-white font-bold shrink-0">${escapeHtml(t('submit'))}</button>
            </div>
          </form>
        </div>
      `);
    }

    /* =========================================================================
       11. EVENT DELEGATION & HANDLERS
       ========================================================================= */
    document.getElementById('lang-select').addEventListener('change', (e) => {
      appState.lang = e.target.value;
      safeStorageSet(STORAGE_KEYS.LANG, appState.lang);
      renderApp();
    });

    document.getElementById('bottom-nav').addEventListener('click', (e) => {
      const btn = e.target.closest('.nav-btn');
      if (!btn) return;
      appState.activeTab = btn.dataset.tab;
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    document.addEventListener('change', (e) => {
      if (e.target.id === 'comm-univ-select') {
        appState.commUnivFilter = e.target.value;
        renderApp();
      } else if (e.target.dataset.action === 'toggle-check') {
        store.toggleCheck(e.target.dataset.check);
        renderApp();
      }
    });

    document.addEventListener('click', async (e) => {
      const target = e.target.closest('[data-action]');
      if (!target) {
        if (e.target.id === 'modal-root') closeModal();
        return;
      }

      const action = target.dataset.action;
      if (action === 'toggle-step') {
        const s = target.dataset.step;
        appState.expandedStepId = appState.expandedStepId === s ? null : s;
        renderApp();
      } else if (action === 'answer-quiz') {
        appState.quizAnswers[target.dataset.qkey] = Number(target.dataset.oidx);
        renderApp();
      } else if (action === 'filter-campus-univ') {
        appState.campusUnivFilter = target.dataset.univ;
        renderApp();
      } else if (action === 'join-festival') {
        const festTitle = target.dataset.festTitle;
        const festUniv = target.dataset.festUniv === '전체' ? '전남대(광주/여수)' : target.dataset.festUniv;
        appState.activeTab = 'community';
        appState.commCatFilter = '축제·여행 동행';
        renderApp();
        openWritePostModal({
          category: '축제·여행 동행',
          univ: festUniv,
          title: `[동행 구해요] ${festTitle} 같이 가실 분!`
        });
      } else if (action === 'select-show-card') {
        appState.activeShowCardId = target.dataset.card;
        renderApp();
      } else if (action === 'select-symptom') {
        appState.activeSymptomId = target.dataset.symptom;
        renderApp();
      } else if (action === 'speak-ko') {
        speakKorean(target.dataset.text);
      } else if (action === 'filter-comm-cat') {
        appState.commCatFilter = target.dataset.cat;
        renderApp();
      } else if (action === 'open-write-modal') {
        openWritePostModal();
      } else if (action === 'close-modal') {
        closeModal();
      } else if (action === 'toggle-translate-post') {
        const pid = target.dataset.postId;
        const post = store.getPosts().find(p => p.id === pid);
        const cacheKey = `post:${pid}:${appState.lang}`;
        if (post && !appState.translatedPosts[pid] && !appState.translationCache[cacheKey]) {
          appState.translationCache[cacheKey] = await translateText(post, appState.lang, false);
        }
        appState.translatedPosts[pid] = !appState.translatedPosts[pid];
        renderApp();
      } else if (action === 'open-comments') {
        openCommentsModal(target.dataset.postId);
      } else if (action === 'toggle-translate-comment') {
        const cid = target.dataset.commentId;
        const pid = target.dataset.postId;
        const post = store.getPosts().find(p => p.id === pid);
        const comment = post && (post.comments || []).find(c => c.id === cid);
        const cCacheKey = `comment:${cid}:${appState.lang}`;
        if (comment && !appState.translatedComments[cid] && !appState.translationCache[cCacheKey]) {
          appState.translationCache[cCacheKey] = await translateText(comment, appState.lang, true);
        }
        appState.translatedComments[cid] = !appState.translatedComments[cid];
        openCommentsModal(pid);
      } else if (action === 'report-post') {
        store.reportPost(target.dataset.postId);
        showToast('🚩 신고가 접수되었습니다.');
        renderApp();
      } else if (action === 'admin-toggle-hide') {
        const pid = target.dataset.postId;
        const isHidden = target.dataset.hidden === '1';
        store.setPostHidden(pid, !isHidden);
        showToast(isHidden ? '게시글이 복구되었습니다.' : '게시글이 숨김 처리되었습니다.');
        renderApp();
      }
    });

    document.addEventListener('submit', (e) => {
      if (e.target.id === 'write-post-form') {
        e.preventDefault();
        const fd = new FormData(e.target);
        store.createPost({
          category: fd.get('category'),
          univ: fd.get('univ'),
          author: fd.get('author'),
          title: fd.get('title'),
          body: fd.get('body'),
          lang: appState.lang
        });
        closeModal();
        showToast('✅ 게시글이 등록되었습니다!');
        renderApp();
      } else if (e.target.id === 'add-comment-form') {
        e.preventDefault();
        const postId = e.target.dataset.postId;
        const fd = new FormData(e.target);
        store.addComment(postId, {
          author: fd.get('author'),
          text: fd.get('text'),
          lang: appState.lang
        });
        openCommentsModal(postId);
        renderApp();
      } else if (e.target.id === 'admin-pin-form') {
        e.preventDefault();
        const pin = document.getElementById('admin-pin-input').value.trim();
        // NOTE: 프로토타입용 클라이언트 PIN 검증입니다.
        // 실제 배포 전 반드시 서버 측 인증(Supabase Auth / JWT 등)으로 교체하세요.
        if (pin === '1234') {
          appState.adminAuthenticated = true;
          renderApp();
        } else {
          showToast('❌ PIN 번호가 올바르지 않습니다. (데모: 1234)');
        }
      } else if (e.target.id === 'admin-fest-form') {
        e.preventDefault();
        const fd = new FormData(e.target);
        store.createFestival({
          title: fd.get('title'),
          region: fd.get('region'),
          date: fd.get('date'),
          location: fd.get('location'),
          transit: fd.get('transit'),
          fee: fd.get('fee') || '무료',
          univTag: fd.get('univTag')
        });
        e.target.reset();
        showToast('🎉 새 축제가 등록되었습니다!');
        renderApp();
      }
    });

    // Initial render
    renderApp();
  </script>
</body>
</html>
